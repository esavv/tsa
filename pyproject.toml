[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_scrape.py" = ["E402"]
"scripts/run_tweet_alerts.py" = ["E402"]
"tests/test_atl_parser.py" = ["E402"]
"tests/test_tweet_alerts.py" = ["E402"]

[tool.vulture]
ignore_decorators = ["@app.route"]
# HTMLParser dispatches to these by name from the base class.
ignore_names = ["row_factory", "handle_starttag", "handle_data", "handle_endtag"]
min_confidence = 60
paths = ["app.py", "scripts", "tests"]
